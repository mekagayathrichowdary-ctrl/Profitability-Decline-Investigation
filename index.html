<main><div class="hero"><h2>Profitability Decline Investigator</h2><p>Net margin has fallen three quarters in a row while every department reports “on target”. The analyst joins Marketing, Operations, HR and Finance data, finds the cross-functional chain behind the decline, and tests fixes on a counterfactual model.</p></div>

<script>
const $=i=>document.getElementById(i),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>sum(a)/(a.length||1),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
let s=5;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;const nrm=()=>{let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*rnd())};
const MN=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'],ML=i=>MN[i%12]+" '"+(24+Math.floor((i+9)/12)),QL=['Q4 24','Q1 25','Q2 25','Q3 25','Q4 25','Q1 26','Q2 26','Q3 26'];
const AP={pk:13,hire:120,cap:25,onb:0},ALL=[1,1,1,1,1,1,1];
// structural model: S[0..6] switch the 7 cross-functional channels on/off
function mdl(P,S,T=24){const o=[],hv=[];let otp=3;for(let t=0;t<T;t++){const rp=cl((t-14)/9,0,1),hr=cl((t-13)/10,0,1);hv.push(hr);const pa=8+(P.pk-8)*rp,pP=S[0]?pa:8,pV=S[1]?pa:8,pR=S[3]?pa:8,pM=S[4]?pa:8;
const orders=400*(1+.004*t)*(1+.035*(pV-8)),exu=5+.9*Math.max(0,(orders-440)/10),ex=S[2]?Math.min(P.cap,exu):5,ot=3+.4*(ex-5),hc=1000+(S[5]?P.hire*hr:0),nh=S[6]?P.hire*(hr-(t>=6?hv[t-6]:0))/hc*100:0,attr=1.2+.12*(otp-3);otp=ot;
const rpen=S[6]?(nh+3*(attr-1.2))*(1-.6*P.onb):0,ret=5+.12*(pR-8)+.15*rpen,fc=118+3.2*(ex-5)+.8*Math.max(0,ot-3),mk=3+.08*(pM-8),Pr=1450*(1-pP/100),gmo=Pr-841-fc-ret/100*Pr*.4;
const rev=orders*Pr/1e4,gm=orders*gmo/1e4,ox=hc*.0055+mk+1.8+(P.hire>0?.35*P.onb:0),net=gm-ox;
o.push({promo:pa,newc:40+2.2*(pV-8)+6*(mk-3),mk,orders,ex,fc,ot,ret,otd:94.5-.15*rpen-.05*(orders-400)/10-(S[2]?.6*(exu-ex):0),hc,nh,attr,rev,gmp:gm/rev*100,ox,net,nm:net/rev*100})}return o}
const OBS=mdl(AP,ALL).map(o=>{const q={...o};['promo','newc','mk','orders','ex','fc','ot','ret','otd','hc','nh','attr','rev','ox'].forEach(k=>q[k]=o[k]*(1+nrm()*.015));q.gmp=o.gmp+nrm()*.5;q.nm=o.nm+nrm()*.6;q.net=q.rev*q.nm/100;q.roi=q.newc*1000*2400/(q.mk*1e7);return q});
const QS=QL.map((_,q)=>{const m=OBS.slice(q*3,q*3+3),a=k=>avg(m.map(x=>x[k])),r=sum(m.map(x=>x.rev)),n=sum(m.map(x=>x.net));return{rev:r,net:n,nm:n/r*100,gmp:a('gmp'),otd:a('otd'),ret:a('ret'),ex:a('ex')}});
const M=[['promo','Discount depth','Marketing','%'],['mk','Marketing spend','Marketing','₹ Cr'],['newc','New customers','Marketing','k'],['roi','Reported campaign ROI','Marketing','x'],['orders','Orders','Operations','k'],['ex','Expedited share','Operations','%'],['fc','Fulfilment cost/order','Operations','₹'],['ret','Return rate','Operations','%'],['otd','On-time delivery','Operations','%'],['hc','Headcount','HR','FTE'],['nh','New-hire share','HR','%'],['ot','Overtime/FTE','HR','h/wk'],['attr','Attrition','HR','%'],['rev','Revenue','Finance','₹ Cr'],['gmp','Gross margin','Finance','%'],['ox','Opex','Finance','₹ Cr'],['nm','Net margin','Finance','%']];
const MD={};M.forEach(m=>MD[m[0]]=m);const DF={};M.forEach(m=>DF[m[0]]=OBS.slice(1).map((o,i)=>o[m[0]]-OBS[i][m[0]]));
const pr=(a,b)=>{const ma=avg(a),mb=avg(b);return sum(a.map((v,i)=>(v-ma)*(b[i]-mb)))/Math.sqrt(sum(a.map(v=>(v-ma)**2))*sum(b.map(v=>(v-mb)**2)))};
const cx=(a,b,L)=>pr(DF[a].slice(0,23-L),DF[b].slice(L));
const EG=[['promo','orders',0],['orders','ex',0],['ex','fc',0],['ex','ot',0],['ot','attr',1],['promo','ret',0],['nh','ret',0],['nh','otd',0],['ret','gmp',0],['fc','gmp',0],['promo','gmp',0],['hc','ox',0],['mk','ox',0],['promo','mk',0],['gmp','nm',0],['ox','nm',0]].map(e=>({a:e[0],b:e[1],L:e[2],r:cx(e[0],e[1],e[2])}));
const PAIRS=[];M.forEach((x,i)=>M.forEach((y,j)=>{if(i<j&&x[2]!=y[2]){const r0=cx(x[0],y[0],0),r1=cx(x[0],y[0],1),r=Math.abs(r0)>=Math.abs(r1)?r0:r1;PAIRS.push({a:x[0],b:y[0],r,mech:EG.some(e=>(e.a==x[0]&&e.b==y[0])||(e.a==y[0]&&e.b==x[0]))})}}));PAIRS.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));
// Shapley attribution over the 7 channels
const FA=[1,1,2,6,24,120,720],CH=[['Deeper discounts cut price','Marketing','Finance'],['Promo-driven order volume','Marketing','Finance'],['Expedited shipping and fulfilment cost','Marketing','Operations'],['Returns from promo buyers','Marketing','Operations'],['Higher marketing spend','Marketing','Finance'],['Payroll from hiring surge','HR','Finance'],['New-hire ramp, burnout, returns','HR','Operations']],SN=['Discounts','Volume','Expedite','Returns','Mkt spend','Payroll','Ramp'];
const q3=(P,S=ALL,T=24)=>{const o=mdl(P,S,T).slice(T-3),r=sum(o.map(x=>x.rev)),n=sum(o.map(x=>x.net));return{rev:r,net:n,nm:n/r*100,gmp:avg(o.map(x=>x.gmp)),otd:avg(o.map(x=>x.otd)),ret:avg(o.map(x=>x.ret)),ex:avg(o.map(x=>x.ex)),fc:avg(o.map(x=>x.fc)),hc:avg(o.map(x=>x.hc))}};
const SH=(()=>{const f=[];for(let m=0;m<128;m++)f.push(q3(AP,[...Array(7)].map((_,i)=>(m>>i)&1)).nm);const ph=[...Array(7)].map((_,j)=>{let t=0;for(let m=0;m<128;m++)if(!((m>>j)&1)){const k=[...Array(7)].reduce((c,_,i)=>c+((m>>i)&1),0);t+=FA[k]*FA[6-k]/5040*(f[m|(1<<j)]-f[m])}return t});return{ph,base:f[0],full:f[127]}})();
const opt=()=>{let b,bs=-1e9;for(let pk=8;pk<=16;pk++)[0,40,80,120,160].forEach(hire=>[8,10,12,25].forEach(cap=>[0,.5,1].forEach(onb=>{const P={pk,hire,cap,onb},r=q3(P);if(r.otd>=90&&r.ret<=7.5&&r.net>bs){bs=r.net;b=P}})));return b};
const ACT=q3(AP),SC=[['Marketing','New customers (k)','newc',45,1,v=>v.toFixed(1)],['Marketing','Reported campaign ROI','roi',3,1,v=>v.toFixed(1)+'x'],['HR','Headcount','hc',1130,0,v=>v.toFixed(0)],['HR','Attrition %','attr',2,0,v=>v.toFixed(2)],['HR','Overtime h/wk','ot',6,0,v=>v.toFixed(1)],['Operations','On-time delivery %','otd',90,1,v=>v.toFixed(1)],['Operations','Fulfilment cost ₹/order','fc',145,0,v=>v.toFixed(0)],['Operations','Return rate %','ret',7.5,0,v=>v.toFixed(1)],['Operations','Expedited share %','ex',12,0,v=>v.toFixed(1)],['Finance','Revenue ₹ Cr/mo','rev',60,1,v=>v.toFixed(1)],['Finance','Opex ₹ Cr/mo','ox',12,0,v=>v.toFixed(1)],['Finance','Gross margin %','gmp',18,1,v=>v.toFixed(1)]];
const L3=OBS.slice(21,24),lv=k=>avg(L3.map(x=>x[k]));
// ---- helpers ----
const f1=v=>v.toFixed(1),pp=v=>(v>=0?'+':'')+v.toFixed(1)+' pp',fm=v=>'₹'+v.toFixed(1)+' Cr',DC={Marketing:'#ec4899',Operations:'#f59e0b',HR:'#8b5cf6',Finance:'#0ea5e9'};
function line(S,L,W=620,H=220){const all=S.flatMap(q=>q.v),mn=Math.min(...all),mx=Math.max(...all),pd=(mx-mn)*.1||1,x=i=>40+i*(W-60)/(L.length-1),y=v=>H-28-(v-mn+pd)/(mx-mn+2*pd)*(H-48);
return`<svg viewBox="0 0 ${W} ${H}" width="100%">`+[0,1,2,3].map(k=>{const v=mn+(mx-mn)*k/3;return`<line x1="40" x2="${W-20}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="34" y="${y(v)+3}" text-anchor="end">${v.toFixed(0)}</text>`}).join('')+L.map((l,i)=>i%(L.length>10?3:1)==0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`:'').join('')+S.map(q=>`<polyline fill="none" stroke="${q.c}" stroke-width="2.5" ${q.d?'stroke-dasharray="5 4"':''} points="${q.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`).join('')+'</svg>'}
function wfall(base,items,fin){const pts=[{l:'No shocks',a:0,b:base,t:1,v:base}];let run=base;items.forEach((v,i)=>{pts.push({l:SN[i],a:run,b:run+v,v});run+=v});pts.push({l:'Actual',a:0,b:fin,t:1,v:fin});const all=pts.flatMap(p=>[p.a,p.b]),lo=Math.min(0,...all),hi=Math.max(...all)*1.12,Y=v=>200-(v-lo)/(hi-lo)*170,bw=560/pts.length;
return`<svg viewBox="0 0 620 235" width="100%" style="min-width:540px"><line x1="40" x2="600" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/>`+pts.map((p,i)=>{const x=44+i*bw,y1=Y(Math.max(p.a,p.b)),h=Math.max(2,Math.abs(Y(p.a)-Y(p.b)));return`<rect x="${x}" y="${y1}" width="${bw-10}" height="${h}" rx="3" fill="${p.t?'var(--ac)':p.v>=0?'#10b981':'#ef4444'}"/><text x="${x+(bw-10)/2}" y="${y1-4}" text-anchor="middle">${p.t?f1(p.v)+'%':(p.v>=0?'+':'')+f1(p.v)}</text><text x="${x+(bw-10)/2}" y="222" text-anchor="middle">${p.l}</text>`}).join('')+'</svg>'}
// ---- views ----
function ovw(){const a=QS[7],b=QS[6],e=QS[4],gc=SC.filter(r=>r[4]?lv(r[2])>=r[3]:lv(r[2])<=r[3]).length;
$('ov').innerHTML=`<div class="g g6">${[['Q3 26 revenue',fm(a.rev),((a.rev/e.rev-1)*100).toFixed(0)+'% vs Q4 25','up'],['Q3 26 net profit',fm(a.net),((a.net/e.net-1)*100).toFixed(0)+'% vs Q4 25','dn'],['Net margin',f1(a.nm)+'%',pp(a.nm-e.nm)+' vs Q4 25','dn'],['Gross margin',f1(a.gmp)+'%',pp(a.gmp-e.gmp)+' vs Q4 25','dn'],['Consecutive declines','3','Q1, Q2, Q3 2026','dn'],['Dept KPIs on target',gc+' / 12','all “satisfactory”','up']].map(k=>`<div class="c kpi"><span>${k[0]}</span><b>${k[1]}</b><em class="${k[3]}">${k[2]}</em></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Net margin by quarter (%)</h3><svg viewBox="0 0 620 220" width="100%">${QS.map((q,i)=>{const w=65,x=44+i*w,h=q.nm/10*150,dec=i>=5;return`<rect x="${x}" y="${190-h}" width="48" height="${h}" rx="4" fill="${dec?'#ef4444':'var(--ac)'}" opacity="${dec?1:.7}"/><text x="${x+24}" y="${184-h}" text-anchor="middle">${f1(q.nm)}%</text><text x="${x+24}" y="208" text-anchor="middle">${QL[i]}</text>`}).join('')}</svg></div>
<div class="c"><h3>Revenue up, profit down (index, Q4 24 = 100)</h3>${line([{c:'#4f46e5',v:QS.map(q=>q.rev/QS[0].rev*100)},{c:'#ef4444',v:QS.map(q=>q.net/QS[0].net*100)}],QL)}<span class="tag"><span class="dot" style="background:#4f46e5"></span>Revenue</span><span class="tag"><span class="dot" style="background:#ef4444"></span>Net profit</span></div></div>
<div class="ins r" style="margin-top:14px"><b>The paradox:</b> revenue is up ${((a.rev/e.rev-1)*100).toFixed(0)}% and ${gc} of 12 departmental KPIs are on target, yet net profit is down ${(-(a.net/e.net-1)*100).toFixed(0)}% versus Q4 25. Each team optimises its own number; the damage sits between them.</div>
<h3 style="margin-top:14px">Departmental scorecards (Q3 26 average vs target)</h3><div class="g g4">${['Marketing','HR','Operations','Finance'].map(d=>`<div class="c" style="border-top:4px solid ${DC[d]}"><h3>${d} <span class="tag gr">on target</span></h3>${SC.filter(r=>r[0]==d).map(r=>{const v=lv(r[2]),ok=r[4]?v>=r[3]:v<=r[3];return`<div class="mr"><span>${r[1]}</span><span><b>${r[5](v)}</b> <span class="mt">${r[4]?'≥':'≤'} ${r[3]}</span> <span class="${ok?'up':'dn'}">${ok?'✔':'✖'}</span></span></div>`}).join('')}</div>`).join('')}</div>`}
function nwm(){const pos={promo:[20,40],mk:[20,120],newc:[20,200],roi:[20,280],orders:[190,20],ex:[190,85],fc:[190,150],ret:[190,215],otd:[190,280],hc:[360,40],nh:[360,115],ot:[360,190],attr:[360,265],rev:[530,40],gmp:[530,110],ox:[530,190],nm:[530,270]},ln=e=>{const [sx,sy]=pos[e.a],[tx,ty]=pos[e.b];if(sx==tx)return[sx+60,sy+(sy<ty?28:0),tx+60,ty+(sy<ty?0:28)];return sx<tx?[sx+120,sy+14,tx,ty+14]:[sx,sy+14,tx+120,ty+14]};
$('nw').innerHTML=`<div class="c"><h2>Cross-functional relationship map</h2><div class="mt sm">Arrows show cause → effect links tested on month-to-month changes. Thickness = strength |r|, red = positive pressure on cost or loss, green = inverse. Nothing here appears in any single department’s report.</div><div class="sc"><svg viewBox="0 0 680 320" width="100%" style="min-width:600px"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>${['Marketing','Operations','HR','Finance'].map((d,i)=>`<text x="${80+i*170}" y="12" text-anchor="middle" style="fill:${DC[d]};font-weight:700;font-size:11px">${d.toUpperCase()}</text>`).join('')}${EG.map(e=>{const l=ln(e),c=e.r>=0?'#ef4444':'#10b981';return`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${c}" stroke-width="${(.6+Math.abs(e.r)*3.2).toFixed(1)}" opacity="${Math.abs(e.r)<.3?.25:.75}" marker-end="url(#ar)"><title>${MD[e.a][1]} → ${MD[e.b][1]}: r=${e.r.toFixed(2)}</title></line>`}).join('')}${M.map(m=>{const p=pos[m[0]];return`<rect x="${p[0]}" y="${p[1]}" width="120" height="28" rx="6" fill="var(--sf)" stroke="${DC[m[2]]}" stroke-width="1.5"/><text x="${p[0]+60}" y="${p[1]+17}" text-anchor="middle" style="fill:var(--tx);font-size:10.5px">${m[1]}</text>`}).join('')}</svg></div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Tested causal links</h3><table><tr><th>Cause</th><th>Effect</th><th>Lag</th><th>r</th></tr>${[...EG].sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)).map(e=>`<tr><td>${MD[e.a][1]} <span class="mt">(${MD[e.a][2]})</span></td><td>${MD[e.b][1]}</td><td>${e.L}m</td><td><b>${e.r.toFixed(2)}</b></td></tr>`).join('')}</table></div>
<div class="c"><h3>Strongest cross-department correlations</h3><table><tr><th>Pair</th><th>r</th><th>Verdict</th></tr>${PAIRS.slice(0,9).map(p=>`<tr><td>${MD[p.a][1]} ↔ ${MD[p.b][1]}</td><td>${p.r.toFixed(2)}</td><td><span class="tag ${p.mech?'gr':'am'}">${p.mech?'Mechanism':'Timing only'}</span></td></tr>`).join('')}</table><div class="sm mt" style="margin-top:8px">“Mechanism” = a business logic path exists. “Timing only” = both moved in the same window, so treat as unproven.</div></div></div>`}
function rcm(){const ph=SH.ph,mk=sum([0,2,3,4].map(i=>ph[i]))+ph[1],hr=ph[5]+ph[6],tot=SH.full-SH.base;
$('rc').innerHTML=`<div class="c"><h2>Where did the margin go?</h2><div class="mt sm">Exact Shapley attribution over 7 cross-functional channels in the structural model: net margin without the Marketing and HR shocks (${f1(SH.base)}%) vs actual Q3 26 (${f1(SH.full)}%).</div><div class="sc">${wfall(SH.base,ph,SH.full)}</div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Channel evidence</h3><table><tr><th>Channel</th><th>Source → hit</th><th>Impact</th></tr>${CH.map((c,i)=>`<tr><td>${c[0]}</td><td><span class="tag" style="color:${DC[c[1]]}">${c[1]}</span>→ ${c[2]}</td><td><b class="${ph[i]>=0?'up':'dn'}">${pp(ph[i])}</b></td></tr>`).join('')}</table></div>
<div class="c"><h3>Who caused it vs who reports it</h3>${[['Marketing (source)',mk],['HR (source)',hr]].map(([n,v])=>`<div class="mr"><span>${n}</span><b class="${v>=0?'up':'dn'}">${pp(v)}</b></div>`).join('')}<div class="mr"><span>Operations (symptom only)</span><b>0.0 pp own</b></div><div class="mr"><span>Finance (symptom only)</span><b>0.0 pp own</b></div>
<div class="ins r"><b>Net effect ${pp(tot)}.</b> Operations’ cost per order (₹${f1(lv('fc'))}) and returns (${f1(lv('ret'))}%) stay inside their targets, yet ${pp(ph[2]+ph[3]+ph[6])} of the loss lands in Ops costs, triggered by promo volume and new-hire ramp.</div><div class="ins">Volume is the one positive channel (${pp(ph[1])}): promotions did bring orders, but the extra gross profit is far smaller than the cost created around it.</div></div></div>`}
let P={...AP};
function labm(){const sl=(k,t,mn,mx,st,f)=>`<div style="margin:12px 0"><b>${t}: <span id="v_${k}">${f(P[k])}</span></b><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${P[k]}"></div>`;
$('lab').innerHTML=`<div class="g g2" style="grid-template-columns:1fr 2fr"><div class="c"><h2>Fix-it lab</h2><div class="mt sm">Counterfactual model: change the levers and see Q3 26-equivalent results.</div>${sl('pk','Peak discount depth',8,16,.5,v=>v+'%')}${sl('hire','Hiring surge (FTE)',0,200,10,v=>v)}${sl('cap','Expedite cap',8,25,1,v=>v==25?'none':v+'%')}${sl('onb','New-hire onboarding programme',0,1,.1,v=>(v*100).toFixed(0)+'%')}<button class="btn" id="ao">✨ AI best plan</button> <button class="btn" id="rs">Reset to actual</button></div><div class="c" id="res"></div></div>`;
document.querySelectorAll('#lab input').forEach(e=>e.oninput=()=>{const k=e.dataset.k;P[k]=+e.value;$('v_'+k).textContent=k=='pk'?P[k]+'%':k=='cap'?(P[k]==25?'none':P[k]+'%'):k=='onb'?(P[k]*100).toFixed(0)+'%':P[k];res()});$('ao').onclick=()=>{P=opt();labm()};$('rs').onclick=()=>{P={...AP};labm()};res()}
function res(){const B=ACT,A=q3(P),ma=mdl(AP,ALL),ms=mdl(P,ALL),k=[['Net margin',B.nm,A.nm,v=>f1(v)+'%',1],['Net profit / qtr',B.net,A.net,fm,1],['Revenue / qtr',B.rev,A.rev,fm,1],['On-time delivery',B.otd,A.otd,v=>f1(v)+'%',1],['Return rate',B.ret,A.ret,v=>f1(v)+'%',0],['Expedite share',B.ex,A.ex,v=>f1(v)+'%',0]];
$('res').innerHTML=`<div class="g g6" style="grid-template-columns:repeat(3,1fr)">${k.map(([t,b,a,f,g])=>{const d=a-b,ch=Math.abs(d)<.005*Math.abs(b);return`<div class="kpi"><span>${t}</span><b>${f(a)}</b><em class="${ch?'mt':(g?d>=0:d<=0)?'up':'dn'}">${f(b)} → ${f(a)}</em></div>`}).join('')}</div>${A.otd<90?'<div class="ins r">On-time delivery falls below the 90% target: this plan trades service for cost.</div>':''}<h3 style="margin-top:12px">Monthly net margin (%): actual vs scenario</h3>${line([{c:'#ef4444',v:ma.map(x=>x.nm)},{c:'#10b981',v:ms.map(x=>x.nm),d:1}],ma.map((_,i)=>ML(i)))}<span class="tag"><span class="dot" style="background:#ef4444"></span>Actual path</span><span class="tag"><span class="dot" style="background:#10b981"></span>Scenario</span><div class="sm mt">Model is a simplified structural simulation. Validate with a pilot before committing.</div>`}
// ---- agent ----
const CHP=['Why did profits decline?','Which departments are responsible?','Show cross-functional links','Why are all departments green?','What is the best fix?','What if promo is 10 and hires 60?'];
function agm(){$('ag').innerHTML=`<div class="g g2" style="grid-template-columns:2fr 1fr"><div class="c"><h3>🤖 AI Business Analyst</h3><div class="chat" id="chat"><div class="m b">Hi! I’ve joined Marketing, HR, Operations and Finance data over 24 months. Ask why profit fell, who is responsible, how departments connect, or test a fix like “promo 10, hire 60, cap 12, onboarding”.</div></div><div class="in"><input id="q" placeholder="Ask about causes, links, departments, fixes…"><button id="go">Send</button></div></div>
<div class="c"><h3>Try asking</h3><div class="chips">${CHP.map(c=>`<button onclick="ask(this.textContent)">${c}</button>`).join('')}</div><h3 style="margin-top:16px">Analyst pipeline</h3><div class="sm mt">1. Ingest 4 departments’ data<br>2. Align monthly and quarterly<br>3. Build departmental scorecards<br>4. Test cross-functional links<br>5. Fit structural model<br>6. Shapley root-cause split<br>7. Counterfactual fixes</div></div></div>`;
$('go').onclick=()=>{const v=$('q').value.trim();if(v){$('q').value='';ask(v)}};$('q').onkeydown=e=>{if(e.key=='Enter')$('go').click()}}
const num=(q,re,d)=>{const m=q.match(re);return m?+m[1]:d};
function reply(q){let st,h;const ph=SH.ph,hasLever=/promo|discount|hire|hiring|cap|expedit|onboard/i.test(q)&&/\d|onboard/i.test(q);
if(hasLever||/what.?if|simulat/i.test(q)){const p={pk:num(q,/(?:promo|discount)\D*(\d+(?:\.\d+)?)/i,AP.pk),hire:num(q,/hir\w*\D*(\d+)/i,AP.hire),cap:num(q,/(?:cap|expedit)\D*(\d+)/i,AP.cap),onb:/onboard/i.test(q)?.8:0},A=q3(p);st=['Parsing levers','Re-running structural model','Comparing with actual'];h=`<b>Scenario:</b> peak discount ${p.pk}%, ${p.hire} hires, expedite cap ${p.cap>=25?'none':p.cap+'%'}, onboarding ${p.onb?'on':'off'}<table><tr><th>Metric</th><th>Actual</th><th>Scenario</th></tr><tr><td>Net margin</td><td>${f1(ACT.nm)}%</td><td><b>${f1(A.nm)}%</b></td></tr><tr><td>Net profit / qtr</td><td>${fm(ACT.net)}</td><td><b>${fm(A.net)}</b></td></tr><tr><td>On-time delivery</td><td>${f1(ACT.otd)}%</td><td>${f1(A.otd)}%</td></tr><tr><td>Return rate</td><td>${f1(ACT.ret)}%</td><td>${f1(A.ret)}%</td></tr></table>${A.otd<90?'Warning: service level drops below 90%.':'Service level stays above target.'}`}
else if(/best|recommend|fix|plan|action|should|solve/i.test(q)){const b=opt(),A=q3(b);st=['Searching 540 lever combinations','Applying service and returns constraints'];h=`<b>Best plan:</b> cap peak discount at ${b.pk}%, hire ${b.hire} (vs ${AP.hire}), expedite cap ${b.cap>=25?'none':b.cap+'%'}, onboarding ${b.onb*100}%.<br>Net margin ${f1(ACT.nm)}% → <b>${f1(A.nm)}%</b>, profit/qtr ${fm(ACT.net)} → <b>${fm(A.net)}</b>, on-time ${f1(A.otd)}%, returns ${f1(A.ret)}%.<br>Owner: a joint Marketing-Ops-HR-Finance review, not any single department.`}
else if(/why|cause|root|responsib|blame|decline|drop|fall|profit/i.test(q)&&!/green|scorecard|satisf/i.test(q)){const o=CH.map((c,i)=>[c[0],ph[i]]).sort((x,y)=>x[1]-y[1]);st=['Running Shapley over 7 channels','Ranking by margin impact'];h=`Net margin: <b>${f1(SH.base)}% → ${f1(SH.full)}%</b> (${pp(SH.full-SH.base)}).<br>${o.slice(0,4).map(c=>`• ${c[0]}: <b>${pp(c[1])}</b>`).join('<br>')}<br>The biggest drivers are Marketing’s discount push and the ops cost it triggered, plus HR’s hiring surge. Volume added ${pp(ph[1])}.`}
else if(/link|relationship|cross|connect|correl|network|depend/i.test(q)){const t=[...EG].sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)).slice(0,5);st=['Testing 16 cause-effect links','Ranking by |r|'];h=`<b>Strongest cross-functional links</b><table>${t.map(e=>`<tr><td>${MD[e.a][1]}</td><td>→ ${MD[e.b][1]}</td><td>r ${e.r.toFixed(2)}</td></tr>`).join('')}</table>Chain: promo → orders → expedite → fulfilment cost → gross margin, and hiring surge → new-hire ramp → returns.`}
else if(/green|scorecard|paradox|satisf|on target|why.*dept/i.test(q)){st=['Reading departmental targets','Comparing with company margin'];h=`All 12 departmental KPIs are inside target (e.g. fulfilment ₹${f1(lv('fc'))} vs ₹145, returns ${f1(lv('ret'))}% vs 7.5%), because targets are set per department with slack. The cost shows up at company level: net margin ${f1(QS[7].nm)}% vs ${f1(QS[4].nm)}% in Q4 25. Marketing’s ROI of ${lv('roi').toFixed(1)}x ignores discount and return costs.`}
else if(/forecast|next quarter|q4|outlook|nothing/i.test(q)){const f=q3(AP,ALL,27);st=['Extending model to Dec 26'];h=`If nothing changes, Q4 26 net margin is projected near <b>${f1(f.nm)}%</b> (profit ${fm(f.net)}). The decline stabilises at the lower level: a structural reset, not a temporary dip.`}
else if(/when|start|timeline|began|first/i.test(q)){st=['Scanning quarterly margins'];h=`Net margin held at ${f1(QS[4].nm)}% in Q4 25, then fell to ${f1(QS[5].nm)}% (Q1), ${f1(QS[6].nm)}% (Q2) and ${f1(QS[7].nm)}% (Q3 26). Discount depth started rising in Jan 26 and the hiring surge began in Nov 25.`}
else if(/market|hr\b|human|operation|ops|financ/i.test(q)){const d=/market/i.test(q)?'Marketing':/hr|human/i.test(q)?'HR':/financ/i.test(q)?'Finance':'Operations',own={Marketing:ph[0]+ph[1]+ph[2]+ph[3]+ph[4],HR:ph[5]+ph[6],Operations:0,Finance:0}[d];st=['Loading '+d+' data'];h=`<b>${d}</b>: ${SC.filter(r=>r[0]==d).map(r=>`${r[1]} ${r[5](lv(r[2]))}`).join(', ')}. All on target.<br>${d=='Operations'||d=='Finance'?'Its costs rise because of upstream Marketing and HR decisions (symptom, not source).':`Traced margin impact: <b>${pp(own)}</b> through cross-functional channels.`}`}
else if(/brief|summar|overview/i.test(q)){st=['Compiling findings'];h=`<b>Summary</b><br>• Net margin ${f1(QS[4].nm)}% → ${f1(QS[7].nm)}% over 3 quarters while revenue rose ${((QS[7].rev/QS[4].rev-1)*100).toFixed(0)}%.<br>• 12/12 department KPIs on target.<br>• Root cause: Marketing discounts + HR hiring surge create Ops and Finance costs.<br>• Best fix is joint: lower discounts, throttled hiring, onboarding, expedite cap.`}
else{st=['Parsing intent'];h='I can explain the profit decline, trace responsibility, show cross-functional links, explain the green scorecards, forecast Q4, run fixes (e.g. “promo 10, hire 60, cap 12”) or recommend a plan.'}
return{st,h}}
function ask(q){document.querySelector('[data-t=ag]').click();const c=$('chat'),u=document.createElement('div');u.className='m u';u.textContent=q;c.appendChild(u);const b=document.createElement('div');b.className='m b';c.appendChild(b);const r=reply(q);let i=0;
const nx=()=>{if(i<r.st.length){b.innerHTML+=`<div class="step"><b>✓</b> ${r.st[i++]}…</div>`;c.scrollTop=1e5;setTimeout(nx,420)}else{b.innerHTML+=`<div style="margin-top:6px">${r.h}</div>`;c.scrollTop=1e5}};b.innerHTML='<div class="step">⚙ Analyst thinking…</div>';setTimeout(()=>{b.innerHTML='';nx()},300)}
const VW={ov:ovw,nw:nwm,rc:rcm,lab:labm,ag:agm};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x==b));Object.keys(VW).forEach(k=>$(k).hidden=k!=t);if(t!='ag'||!$('chat'))VW[t]()});
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
ovw();
</script></body></html>
